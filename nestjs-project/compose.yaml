x-app: &app
  image: vertice-video:local
  build: .
  env_file: .env
  environment:
    DB_HOST: db
    S3_ENDPOINT: http://storage:9000
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://storage:9000}
    REDIS_HOST: queue
  init: true

services:
  nestjs-api:
    <<: *app
    ports: ["3000:3000"]
    command: ["node", "dist/main.js"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://nestjs-api:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["npm", "run", "migration:run"]
    depends_on:
      db: {condition: service_healthy}
  video-worker:
    <<: *app
    command: ["node", "dist/video-worker.js"]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 2
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      queue: {condition: service_healthy}
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: streamtube
      POSTGRES_PASSWORD: streamtube
      POSTGRES_DB: streamtube
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
  queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: vertice-minio:local
    build:
      context: .
      dockerfile: infra/Dockerfile.minio
      target: server
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-streamtube}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-streamtube-local-only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ALLOW_ORIGIN:-http://nestjs-api:3000}
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    ports: ["9000:9000", "9001:9001"]
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://storage:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
  storage-init:
    image: vertice-minio-client:local
    build:
      context: .
      dockerfile: infra/Dockerfile.minio
      target: client
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-streamtube}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-streamtube-local-only}
    depends_on:
      storage: {condition: service_healthy}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until mc alias set local http://storage:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done
        mc mb --ignore-existing local/videos
        mc anonymous set none local/videos

volumes:
  postgres-data:
  storage-data:
  redis-data:
